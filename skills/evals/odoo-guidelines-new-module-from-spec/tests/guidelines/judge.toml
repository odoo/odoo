# LLM judge: how the agent's code follows the house rules.
# One 5-point criterion per area of the rules (odoo-guidelines,
# odoo-web-guidelines, odoo-security), judged on every text file of the new
# modules and on the changes to existing modules (new code only). The rules
# are tests/guidelines/rules.md, copied from the skills by
# answer_key/sync_guidelines.sh. The spec is given so that a deviation it
# forces, commented as the rules ask, is not counted. An area the agent wrote
# no code for scores 5.
[judge]
judge = "anthropic/claude-opus-5-5"
files = ["/logs/verifier/module_source.txt", "/logs/verifier/existing_changes.diff", "/logs/verifier/spec.md", "/tests/guidelines/rules.md"]
reasoning_effort = "high"
guard = "flag"

[[criterion]]
name = "architecture"
type = "likert"
points = 5
description = """
Rules: the section(s) `odoo-guidelines/guidelines/architecture.md` of /tests/guidelines/rules.md (which module each part of the feature goes in: the owning module, a module of its own for a reusable capability, a bridge between two apps).
Judge the agent's code (the new modules in /logs/verifier/module_source.txt,
the changes to existing modules in /logs/verifier/existing_changes.diff, new
lines only) against those rules only, as a reviewer applying them to new code
on master would. A departure from a rule that the spec
(/logs/verifier/spec.md) forces is not a violation when a comment at that spot
says so and why, as "Comment a deviation the requirements force" asks; without
that comment, it counts. List each violation you find with its file and line
before scoring.

5: no violation, or the agent wrote no code these rules apply to.
4: one minor violation.
3: a few violations, or one that a reviewer would block the PR for.
2: many violations, or several blocking ones.
1: the rules are ignored throughout.
"""

