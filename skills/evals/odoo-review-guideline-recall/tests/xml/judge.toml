# LLM judge: recall of the seeded issues in one area.
# Area: Views, actions, data records, view inheritance.
# Rules: odoo-guidelines guidelines/xml.md.
# One binary criterion per issue; the area's score is the share found.
[judge]
judge = "anthropic/claude-opus-5-5"
files = ["/logs/verifier/review.md"]
reasoning_effort = "high"
guard = "flag"

[[criterion]]
name = "xm1_record_attribute_order"
type = "binary"
description = """
Seeded issue in `addons/equipment_booking/views/booking.xml`, line 4:
The form view record is written <record model=... id=...>: id comes before
model.

Passes when the review in /logs/verifier/review.md reports this problem at
this spot, in any wording and with any severity, possibly grouped with
similar findings as long as this spot is identified (file and line, or the
method, field, record or file it is in). Fails when the review does not
mention it, or covers it only with a general remark that does not point at
this spot.
"""

[[criterion]]
name = "xm2_records_grouped_by_model"
type = "binary"
description = """
Seeded issue in `addons/equipment_booking/views/booking.xml`:
views/booking.xml interleaves records of different models (views, actions,
views again, the equipment view, menus) instead of grouping them by model.

Passes when the review in /logs/verifier/review.md reports this problem at
this spot, in any wording and with any severity, possibly grouped with
