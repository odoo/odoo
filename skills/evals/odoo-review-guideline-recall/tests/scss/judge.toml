name = "css2_mixin_name"
type = "binary"
description = """
Seeded issue in `addons/equipment_booking/static/src/scss/booking_board.scss`, line 5:
The mixin cardShadow is not named o-[imperative verb] (e.g. o-add-card-
shadow), and its argument $size is not in scoped form ($-size). Flagging
