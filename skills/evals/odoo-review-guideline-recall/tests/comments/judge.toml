# LLM judge: recall of the seeded issues in one area.
# Area: Plain ASCII punctuation.
# Rules: odoo-guidelines guidelines/comments.md.
# One binary criterion per issue; the area's score is the share found.
[judge]
judge = "anthropic/claude-opus-5-5"
files = ["/logs/verifier/review.md"]
reasoning_effort = "high"
guard = "flag"

[[criterion]]
name = "as1_em_dash_comment"
type = "binary"
description = """
Seeded issue in `addons/equipment_booking/models/booking.py`, line 205:
The comment in _cron_send_reminders uses an em dash (—); comments use ASCII
punctuation.

Passes when the review in /logs/verifier/review.md reports this problem at
this spot, in any wording and with any severity, possibly grouped with
similar findings as long as this spot is identified (file and line, or the
method, field, record or file it is in). Fails when the review does not
mention it, or covers it only with a general remark that does not point at
this spot.
"""

[[criterion]]
name = "as2_curly_quotes_message"
type = "binary"
description = """
Seeded issue in `addons/equipment_booking/models/booking.py`, line 167:
The UserError in checkin uses curly quotes (“confirmed”) in a user-facing
string; use ASCII quotes.

Passes when the review in /logs/verifier/review.md reports this problem at
this spot, in any wording and with any severity, possibly grouped with
similar findings as long as this spot is identified (file and line, or the
method, field, record or file it is in). Fails when the review does not
mention it, or covers it only with a general remark that does not point at
this spot.
"""

[[criterion]]
name = "as3_ellipsis_help"
type = "binary"
description = """
Seeded issue in `addons/equipment_booking/models/booking.py`, line 50:
The help of the note field ends with the ellipsis character (…); write three
dots.

Passes when the review in /logs/verifier/review.md reports this problem at
this spot, in any wording and with any severity, possibly grouped with
similar findings as long as this spot is identified (file and line, or the
method, field, record or file it is in). Fails when the review does not
mention it, or covers it only with a general remark that does not point at
this spot.
"""
