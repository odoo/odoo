type = "binary"
description = """
Seeded issue in `addons/equipment_booking/models/booking.py`, line 101:
_validate_no_overlap loads every non-cancelled booking of the equipment,
history included, and compares each checked booking with all of them in a
nested loop; restrict the search to overlapping periods (or group by
