services:
  web:
    build: .
    ports:
      - "8099:8069"
    command: odoo -d db_sifnext -u sifnext_org,presenly,presenly_payroll,sifnext_operational,sif_rka,sifnext_ppl,sif_keuangan,sifnext_asset,hr_payroll_custom,pendapatan,transaksi,education_billing --proxy-mode
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
    env_file:
      - .env
    networks:
      - dokploy-network
    restart: always

volumes:
  odoo-web-data:

networks:
  dokploy-network:
    external: true
