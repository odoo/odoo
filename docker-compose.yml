services:
  web:
    image: odoo:19.0
    ports:
      - "8099:8069"
    command: odoo -d db_sifnext --proxy-mode
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
    environment:
      - HOST
      - PORT
      - USER
      - PASSWORD
    restart: always

volumes:
  odoo-web-data:
