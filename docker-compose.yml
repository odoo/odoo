# =============================================================================
# docker-compose.yml — Odoo 19 + Postgres 16 for invoice_agent
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d          # start
#   docker compose down -v        # stop + delete named volumes (DESTRUCTIVE)
#   docker compose logs -f        # tail logs
# =============================================================================

services:
  invoice-ai:
    build:
      context: ./invoice-ai
    restart: unless-stopped
    env_file: .env
    environment:
      INVOICE_AI_JWT_SECRET: ${INVOICE_AI_JWT_SECRET:-}
      INVOICE_AI_JWT_AUDIENCE: invoice-ai
      INVOICE_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Redis — LLM extraction result cache (avoids redundant Claude calls)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_CACHE_TTL_HOURS: "168"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=5)\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  db:
    # pgvector image keeps the Postgres 16 base and preloads the vector
    # extension — the `CREATE EXTENSION vector` init below (idempotent on
    # every fresh-volume start) enables it per database. v0.10: vendor-doc
    # RAG embeddings live in a vector(1024) column with an HNSW cosine index.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    # Observability + slow-query diagnostics (v0.5 "Tuned" work):
    #   - pg_stat_statements: per-query execution stats (total_exec_time,
    #     calls, shared hit/read buffers) — rank real offenders.
    #   - track_io_timing=on: buffers + actual I/O timings in EXPLAIN.
    #   - log_min_duration_statement=200: log slow queries for follow-up.
    # v0.10 adds `vector` to shared_preload_libraries (pgvector image).
    #
    # Loopback-only port 5432: lets a host-side client reach the db without
    # exposing it to the LAN. Production: keep this commented out — nginx/
    # odoo reach the db over the compose network.
    ports:
      - "127.0.0.1:5434:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,vector
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=200
    volumes:
      # Idempotent vector-extension bootstrap: runs once on a fresh volume
      # (and is a no-op on existing volumes). Kept small so Odoo's own
      # migrations never race it (Odoo depends_on db: healthy).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    env_file: .env
    environment:
      # Credentials come exclusively from .env — never committed.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-invoice_agent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-invoice_agent}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Loopback-only management UI for the local exercise (watch ack counts,
    # declare test queues with rabbitmqadmin). The AMQP port 5672 is NEVER
    # exposed: Odoo and the AI worker reach the broker over the private
    # compose network only. Production: keep this ports block commented out
    # entirely — no public 5672 or 15672 on EC2 (see docker-compose.prod.yml).
    ports:
      - "127.0.0.1:15672:15672"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  worker:
    build:
      context: ./invoice-ai
    restart: unless-stopped
    command: python -m app.consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-invoice_agent}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-invoice_agent}
      INVOICE_AI_JWT_SECRET: ${INVOICE_AI_JWT_SECRET:-}
      INVOICE_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Redis — LLM extraction result cache (avoids redundant Claude calls)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_CACHE_TTL_HOURS: "168"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Session store (session_redis) + LLM extraction cache (llm_cache)
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Loopback-only for local Redis debugging. App containers reach Redis
    # over the private compose network as `redis:6379` — never via localhost.
    ports:
      - "127.0.0.1:6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  odoo:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      # Pass Anthropic API key securely from environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # RabbitMQ — forwarded so queue.publisher connects with the same
      # credentials the broker container was created with (RABBITMQ_HOST
      # defaults to the compose service name "rabbitmq" in code).
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-invoice_agent}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-invoice_agent}
      # Tell Odoo it's behind a reverse proxy so it trusts
      # X-Forwarded-For and X-Forwarded-Proto headers.
      # Equivalent to proxy_mode = True in odoo.conf
      PROXY_MODE: "True"
      # Public base URL. invoice_agent's post_init_hook seeds Odoo's
      # web.base.url system parameter from this on every install/upgrade.
      # Value comes exclusively from the environment (see .env / env_file).
      URL: ${URL:-}
      # Redis — used by session_redis addon for HTTP session storage
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ODOO_SESSION_REDIS_PREFIX: "odoo-session:"
      ODOO_SESSION_REDIS_TTL_DAYS: "7"
    ports:
      # Production: comment these out! Nginx is the only entry point.
      # Ports 8069 and 8072 are exposed only for local dev / debugging.
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      # Bind-mount custom_addons for live addon development.
      # Changes to .py / .xml files in custom_addons/ are reflected
      # on the container's filesystem instantly.
      - ./custom_addons:/mnt/extra-addons
      # Named volume: filestore survives container recreation
      - odoo-web-data:/var/lib/odoo
    # --dev=reload enables hot-reload of Python files when running on Linux
    # hosts (EC2, WSL2, native Linux). On Docker Desktop for Windows the
    # bind-mount doesn't emit inotify events, so you must restart the
    # container after .py edits:  docker compose restart odoo
    command: odoo --addons-path=/opt/odoo/addons,/mnt/extra-addons --dev=reload,qweb,werkzeug,xml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # nginx — Reverse proxy, TLS termination, websocket forwarding
  #
  # This is the ONLY service exposed to the internet. Ports 80 and 443
  # must be open in the EC2 security group. Port 8069 on the Odoo service
  # is bound ONLY to 127.0.0.1 for local debugging — the security group
  # should NOT open 8069 to 0.0.0.0/0.
  # ============================================================================
  nginx:
    image: nginx:alpine
    restart: always
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - odoo
      - invoice-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # certbot — Let's Encrypt TLS certificate issuance and renewal
  #
  # On first run, manually execute:
  #   docker compose run --rm certbot certonly --webroot \
  #       -w /var/www/certbot -d invoices.<domain>
  #
  # Auto-renewal happens every 12 hours via the sleep loop below.
  # After renewal, nginx must be reloaded:
  #   docker compose exec nginx nginx -s reload
  # ============================================================================
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
volumes:
  odoo-db-data:
    name: odoo-db-data
  odoo-web-data:
    name: odoo-web-data
  rabbitmq-data:
    name: rabbitmq-data
  redis-data:
    name: redis-data
  certbot-www:
    name: certbot-www
  certbot-conf:
    name: certbot-conf
