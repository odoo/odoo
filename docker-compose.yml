services:

  odoo-db:
    image: postgres:16
    container_name: odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tnpd-prison-db
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d tnpd-prison-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: tnpd-odoo:latest
    container_name: tnpd-prison-be
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
      UPGRADE_MODULES: prison_jail_master,tnpd_prison_vacancy,tnpd_hr_employee
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: s.varsha@giggso.com
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: s.varsha@giggso.com
      SMTP_FROM_NAME: TNPD Prison HRMS
      APP_URL: ${APP_URL:-https://dev-tnprisons.giggso.com}

volumes:
  odoo-db-data:
  odoo-web-data:
