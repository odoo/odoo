# =============================================================================
# docker-compose.yml — Odoo 19 + Postgres 16 for invoice_agent
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d          # start
#   docker compose down -v        # stop + delete named volumes (DESTRUCTIVE)
#   docker compose logs -f        # tail logs
# =============================================================================

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    # ports: # - "127.0.0.1:5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  odoo:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      # Tell Odoo it's behind a reverse proxy so it trusts
      # X-Forwarded-For and X-Forwarded-Proto headers.
      # Equivalent to proxy_mode = True in odoo.conf
      PROXY_MODE: "True"
      # Public base URL. invoice_agent's post_init_hook seeds Odoo's
      # web.base.url system parameter from this on every install/upgrade.
      # Value comes exclusively from the environment (see .env / env_file).
      URL: ${URL:-}
    ports:
      # Production: comment these out! Nginx is the only entry point.
      # Ports 8069 and 8072 are exposed only for local dev / debugging.
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      # Bind-mount custom_addons for live addon development.
      # Changes to .py / .xml files in custom_addons/ are reflected
      # on the container's filesystem instantly.
      - ./custom_addons:/mnt/extra-addons
      # Named volume: filestore survives container recreation
      - odoo-web-data:/var/lib/odoo
    # --dev=reload enables hot-reload of Python files when running on Linux
    # hosts (EC2, WSL2, native Linux). On Docker Desktop for Windows the
    # bind-mount doesn't emit inotify events, so you must restart the
    # container after .py edits:  docker compose restart odoo
    command: odoo --addons-path=/opt/odoo/addons,/mnt/extra-addons --dev=reload,qweb,werkzeug,xml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # nginx — Reverse proxy, TLS termination, websocket forwarding
  #
  # This is the ONLY service exposed to the internet. Ports 80 and 443
  # must be open in the EC2 security group. Port 8069 on the Odoo service
  # is bound ONLY to 127.0.0.1 for local debugging — the security group
  # should NOT open 8069 to 0.0.0.0/0.
  # ============================================================================
  nginx:
    image: nginx:alpine
    restart: always
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - odoo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # certbot — Let's Encrypt TLS certificate issuance and renewal
  #
  # On first run, manually execute:
  #   docker compose run --rm certbot certonly --webroot \
  #       -w /var/www/certbot -d invoices.<domain>
  #
  # Auto-renewal happens every 12 hours via the sleep loop below.
  # After renewal, nginx must be reloaded:
  #   docker compose exec nginx nginx -s reload
  # ============================================================================
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
volumes:
  odoo-db-data:
    name: odoo-db-data
  odoo-web-data:
    name: odoo-web-data
  certbot-www:
    name: certbot-www
  certbot-conf:
    name: certbot-conf
