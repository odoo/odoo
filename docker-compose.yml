services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"   # <-- ADD THIS LINE IF MISSING
    restart: unless-stopped   # <-- Add this line
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
    restart: unless-stopped   # <-- Add this line
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    volumes:
      - .:/opt/odoo
      # Mount our custom_addons (our own customization modules) into the
      # container's custom_addons path (created in the Dockerfile).
      # Listed on addons_path in docker/odoo.conf.
      - ./custom_addons:/mnt/custom_addons
      - odoo-web-data:/var/lib/odoo
    # No `reload`: it needs inotify, which cannot see Windows host writes through the
    # bind mount and hangs boot watching ~620 addons. Restart the container after .py edits.
    command: ["python", "odoo-bin", "-c", "/etc/odoo/odoo.conf", "--dev=qweb,werkzeug,xml"]

volumes:
  odoo-db-data:
  odoo-web-data:
