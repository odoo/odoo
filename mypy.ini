# mypy configuration for the Python type-check gate (.github/workflows/py_typecheck.yml).
#
# Scope: checked in module mode (`mypy -p odoo.orm -p odoo.db ...`), and the
# gate ratchets package-by-package, mirroring the TypeScript typecheck gate.
# THIS FILE DOES NOT SET THE SCOPE -- the `-p` flags in py_typecheck.yml do,
# and they now name three groups on three separate floors: the six framework
# packages (`mypy`), `odoo.tools` (`mypy_tools`) and `odoo.cli` (`mypy_cli`).
# Kept apart rather than summed, so a move is never ambiguous between them.
# The rest of the tree (odoo/addons/**, legacy modules) is still out of scope.
#
# follow_imports = silent keeps the analysis bounded: imports outside the
# checked packages are followed for types but their own errors are not reported.
#
# Per-package tightening (disallow_untyped_defs = True) lands as each package's
# baseline reaches zero; odoo.orm did on 2026-09-22.

[mypy]
python_version = 3.14
follow_imports = silent
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
warn_unused_configs = True
show_error_codes = True
show_column_numbers = True
# Strict-family checks that are cheap to satisfy and high-signal.
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True

# odoo.orm is fully annotated outside its tests (2026-09-22): a new function
# without a complete signature fails the core lane. The test trees keep the
# global checks only.
[mypy-odoo.orm.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-odoo.orm.tests.*,odoo.orm.components.tests.*,odoo.orm.domain.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Generated / vendored code is never type-checked.
[mypy-odoo.libs._vendor.*]
ignore_errors = True
