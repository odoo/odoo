[tool.poetry]
name = "odoo"
package-mode = false
requires-poetry = "2.4.1"

[tool.poetry.dependencies]
python = "^3.11.15"

[tool.poetry.group.odoo.dependencies]
babel = "2.16.0"
chardet = "4.0.0"
cryptography = "48.0.1"
decorator = "4.4.2"
docutils = "0.16"
ebaysdk = "2.1.5"
freezegun = "0.3.15"
gevent = "25.5.1"
greenlet = "3.2.3"
idna = "3.15"
Jinja2 = "3.1.6"
libsass = "0.20.1"
lxml = {version = "5.4.0", extras = ["html-clean"]}
MarkupSafe = "2.1.5"
num2words = "0.5.14"
ofxparse = "0.21"
passlib = "1.7.4"
Pillow = "12.3.0"
polib = "1.1.0"
psutil = "5.9.4"
psycopg2 = "2.9.10"
pydot = "1.4.2"
pyopenssl = "26.2.0"
PyPDF2 = "2.12.1"
pyserial = "3.5"
python-dateutil = "2.8.1"
python-ldap = "3.4.5"
python-stdnum = "1.16"
pyusb = "1.2.1"
qrcode = "6.1"
reportlab = "3.6.13"
requests = "2.33.0"
setuptools = "80.9.0"
urllib3 = "2.7.0"
vobject = "0.9.9"
Werkzeug = "3.1.6"
xlrd = "1.2.0"
XlsxWriter = "1.4.5"
xlwt = "1.3.0"
zeep = "4.3.3"

python-magic = "0.4.27"
cairocffi = "0.9.0"
pytz = "^2024.2"

[tool.poetry.group.testing]
optional = true

[tool.poetry.group.testing.dependencies]
phonenumbers = "8.13.47"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
