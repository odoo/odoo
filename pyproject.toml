[tool.poetry]
name = "odoo"
package-mode = false
requires-poetry = "2.4.1"

[tool.poetry.dependencies]
python = "^3.11.15"

[tool.poetry.group.odoo.dependencies]
babel = "2.16.0"
chardet = "3.0.4"
cryptography = "48.0.1"
decorator = "4.4.2"
docutils = "0.16"
ebaysdk = "2.1.5"
freezegun = "0.3.15"
gevent = {git = "https://github.com/jobrad-gmbh/gevent.git", rev = "b911625b3d0958be9cd24946855b9d240c7b0969"}
greenlet = "3.2.3"
idna = "3.15"
Jinja2 = "3.1.6"
libsass = "0.18.0"
lxml = {version = "5.4.0", extras = ["html-clean"]}
MarkupSafe = "2.1.5"
num2words = "0.5.14"
ofxparse = "0.21"
passlib = "1.7.3"
Pillow = "12.2.0"
polib = "1.1.0"
psutil = "5.6.7"
psycopg2 = "2.9.10"
pydot = "1.4.1"
pyopenssl = "26.2.0"
PyPDF2 = "1.27.12"
pyserial = "3.4"
python-dateutil = "2.7.3"
python-ldap = "3.4.5"
python-stdnum = "1.13"
pyusb = "1.0.2"
qrcode = "6.1"
reportlab = "3.6.13"
requests = "2.33.0"
setuptools = "80.9.0"
urllib3 = "2.7.0"
vobject = "0.9.9"
Werkzeug = "3.1.6"
xlrd = "1.2.0"
XlsxWriter = "1.4.5"
xlwt = "1.3.0"
zeep = "3.4.0"
python-magic = "0.4.27"
cairocffi = "0.9.0"
pytz = "^2024.2"

[tool.poetry.group.testing]
optional = true

[tool.poetry.group.testing.dependencies]
phonenumbers = "8.13.47"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
