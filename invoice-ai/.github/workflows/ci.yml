name: invoice-ai CI

"on":
    pull_request:
        paths:
            - "invoice-ai/**"
            - ".github/workflows/ci.yml"
    push:
        branches: [main]
        paths:
            - "invoice-ai/**"

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: invoice-ai
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: invoice-ai/pyproject.toml

            - name: Install service + dev deps
              run: pip install -e ".[dev]"

            - name: Lint (ruff)
              run: ruff check app tests

            - name: Run tests (httpx ASGITransport, mocked Claude)
              run: pytest -q

            - name: Verify app imports
              run: python -c "from app.main import app; assert app.title == 'invoice-ai'"

    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - name: Build image
              run: docker build -t invoice-ai:ci invoice-ai/
