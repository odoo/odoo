[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "invoice-ai"
version = "1.0.0"
description = "Standalone vendor invoice extraction service for the invoice_agent Odoo addon (ADR-003)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3" }
dependencies = [
    "anthropic>=0.70.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "PyJWT>=2.8.0",
    "aio-pika>=9.4.0",
    "voyageai>=0.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "prometheus_client>=0.20.0",
    "prometheus_fastapi_instrumentator>=7.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pyyaml>=6.0.0",
    "locust>=2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
# The task brief pins two mypy docs rules: no unchecked send/recv on
# sockets (only relevant on native code — n/a here) and strict typing.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

# Third-party SDKs (anthropic, pdf2image, pytesseract) either lack stubs or
# ship broad vendor stubs; their interfaces are exercised indirectly through
# the isolated app/claude.py + app/ocr.py seams.
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "pdf2image.*",
    "pytesseract.*",
    "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true
