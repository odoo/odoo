[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "invoice-ai"
version = "1.0.0"
description = "Standalone vendor invoice extraction service for the invoice_agent Odoo addon (ADR-003)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3" }
dependencies = [
    "anthropic>=0.70.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "anyio>=4.0.0", "httpx>=0.27.0", "ruff>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
