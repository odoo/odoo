; Odoo configuration template.
; Rendered by docker/entrypoint.sh at container start: ${VARS} are replaced
; with environment values (defaults set in the entrypoint), and the result is
; written to /etc/odoo/odoo.conf. Secrets never live in this file.
[options]
addons_path = /opt/odoo/addons
data_dir = /var/lib/odoo

; --- database -----------------------------------------------------------
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
list_db = ${ODOO_LIST_DB}

; --- security -----------------------------------------------------------
admin_passwd = ${ODOO_ADMIN_PASSWD}
proxy_mode = True

; --- workers / limits (sized for ~4 CPU / 8 GB RAM) ---------------------
workers = ${ODOO_WORKERS}
max_cron_threads = 2
limit_memory_soft = ${ODOO_LIMIT_MEMORY_SOFT}
limit_memory_hard = ${ODOO_LIMIT_MEMORY_HARD}
limit_time_cpu = 600
limit_time_real = 1200
limit_request = 65536

; --- network / logging --------------------------------------------------
http_port = 8069
gevent_port = 8072
log_level = ${ODOO_LOG_LEVEL}
; log to stdout (collected by docker)
logfile =
