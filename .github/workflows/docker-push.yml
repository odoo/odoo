name: Build and Push Images to Docker Hub

on:
    push:
        branches:
            - main

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 1. بناء ونشر odoo-invoice-ai
            - name: Build and push Invoice AI Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile # مسار الـ Dockerfile الخاص بالمشروع
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/odoo-invoice-ai:latest

            # 2. بناء ونشر odoo:19
            - name: Build and push Odoo 19 Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile.odoo19 # ضع مسار الـ Dockerfile الخاص بـ odoo 19 هنا
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/odoo:19
