name: CI - Lint and Test

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_call:

permissions:
  # contents: read is all this workflow needs (checkout + tests).
  # NOTE: do NOT request pull-requests/:id-token here. When this workflow is
  # called from deploy.yml (workflow_call), GitHub only allows permissions
  # that the caller grants — deploy.yml grants contents: read only, so any
  # extra scope here would make the reusable-workflow call invalid.
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NOTE: pip cache is intentionally NOT enabled here. This job installs
      # no pip packages (ruff steps are commented out), so `cache: pip` would
      # only write a nearly-empty cache entry and force a pre-create hack to
      # stop setup-python's post-job cache-save from failing on a missing
      # folder. If ruff gets re-enabled, add `cache: pip` back together with
      # the ruff install step.

      # --- ruff is disabled for now ---
      # To re-enable, uncomment the three steps below. The linter and formatter
      # are deliberately scoped to custom_addons/invoice_agent only: `ruff check .`
      # would also lint Odoo's core addons/, whose upstream style does not match
      # these ruff settings (utf8-encoding-declaration, blank-lines-after-function-or-class)
      # and would fail the build.
      #
      # - name: Install ruff
      #   # Pin to the version ruff.toml was generated for (0.15.0+)
      #   run: pip install ruff==0.15.0
      #
      # - name: Run ruff linter
      #   run: ruff check custom_addons/invoice_agent
      #
      # - name: Run ruff format check
      #   run: ruff format --check custom_addons/invoice_agent

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        # `--health-cmd pg_isready -U odoo` would be split by the runner and
        # Docker would parse the bare `-U` as an unknown flag on the container
        # create. Quote `pg_isready -U odoo` as a single command string.
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # setup-python caches pip with a key derived from the dependency files
      # listed in `cache-dependency-path` (repo + module requirements).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            custom_addons/invoice_agent/requirements.txt

      # Guard against setup-python's post-job cache save:
      # "Cache folder path is retrieved for pip but doesn't exist on disk".
      - name: Pre-create pip cache directory
        run: mkdir -p ~/.cache/pip

      - name: Install System C-Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libxml2-dev libxslt1-dev libldap2-dev libsasl2-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r custom_addons/invoice_agent/requirements.txt
          pip install coverage

      - name: Make odoo-bin executable
        run: chmod +x ./odoo-bin

      - name: Run Odoo tests for invoice_agent under coverage
        run: |
          set -o pipefail

          # Execute Odoo under coverage tracking
          coverage run --concurrency=thread --source=custom_addons/invoice_agent \
            ./odoo-bin -d ci -i invoice_agent --addons-path=addons,custom_addons \
            --load=base,web,invoice_agent \
            --test-enable --test-tags /invoice_agent --stop-after-init \
            --log-level=test --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo 2>&1 | tee odoo-test.log

          # Filter out benign docutils warnings before evaluating genuine test errors
          if grep -E 'FAIL|ERROR|CRITICAL' odoo-test.log | grep -vE '\([A-Z]+/[0-9]+\)' | grep -q . ; then
            echo "Real failure or error detected in Odoo test logs."
            exit 1
          fi

      - name: Coverage report and gate
        env:
          COVERAGE_MIN: "60"
        run: |
          # Verify .coverage exists before attempting analysis
          if [ ! -f .coverage ]; then
            echo "Error: No .coverage file found on disk!"
            exit 1
          fi

          coverage report -m
          coverage xml -o coverage.xml

          TOTAL=$(coverage report | awk '/^TOTAL/{print $NF}' | tr -d '%')

          if [ -z "$TOTAL" ]; then
            echo "Error: Could not extract coverage total."
            exit 1
          fi

          echo "invoice_agent total coverage: ${TOTAL}%"

          if [ "${TOTAL%%.*}" -lt "${COVERAGE_MIN}" ]; then
            echo "Coverage gate failed: ${TOTAL}% is below the required ${COVERAGE_MIN}%"
            exit 1
          fi

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-agent-coverage
          path: coverage.xml

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log
          path: odoo-test.log
