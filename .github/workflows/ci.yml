name: CI - Lint and Test

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_call:

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Terraform: format + validate on infra/ changes
  # ==========================================================================
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: infra/terraform

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/terraform

  # ==========================================================================
  # Observability: validate Prometheus + Alertmanager + Grafana configs
  # ==========================================================================
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus config
        run: |
          docker run --rm -v "${{ github.workspace }}/infra/observability/prometheus:/etc/prometheus" \
            --entrypoint promtool \
            prom/prometheus:v2.53.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "${{ github.workspace }}/infra/observability/alertmanager:/etc/alertmanager" \
            --entrypoint amtool \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: |
          python3 -c "import json, sys; json.load(open('infra/observability/grafana/dashboards/agent-slo.json')); print('Dashboard JSON is valid')"

  # ==========================================================================
  # Python: lint + test
  # ==========================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Lint Check
        run: ruff check custom_addons/invoice_agent --config pyproject.toml

      - name: Ruff Format Check
        run: ruff format custom_addons/invoice_agent --config pyproject.toml --check

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            custom_addons/invoice_agent/requirements.txt
            pyproject.toml

      - name: Pre-create pip cache directory
        run: mkdir -p ~/.cache/pip

      - name: Install System C-Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libxml2-dev libxslt1-dev libldap2-dev libsasl2-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r custom_addons/invoice_agent/requirements.txt
          pip install coverage

      - name: Make odoo-bin executable
        run: chmod +x ./odoo-bin

      - name: Run Odoo tests for invoice_agent under coverage
        run: |
          set -o pipefail
          coverage run --concurrency=thread --source=custom_addons/invoice_agent \
            ./odoo-bin -d ci -i invoice_agent --addons-path=addons,custom_addons \
            --test-enable --test-tags /invoice_agent --stop-after-init \
            --log-level=warn --log-handler=odoo.addons.invoice_agent:INFO \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo 2>&1 | tee odoo-test.log

          if grep -qE "FAIL: Test|ERROR: Test" odoo-test.log; then
            echo "Real failure or error detected in Odoo test execution."
            exit 1
          fi

      - name: Coverage report and gate
        env:
          COVERAGE_MIN: "60"
        run: |
          if [ ! -f .coverage ]; then
            echo "Error: No .coverage file found on disk!"
            exit 1
          fi

          coverage report -m
          coverage xml -o coverage.xml

          TOTAL=$(coverage report | awk '/^TOTAL/{print $NF}' | tr -d '%')

          if [ -z "$TOTAL" ]; then
            echo "Error: Could not extract coverage total."
            exit 1
          fi

          echo "invoice_agent total coverage: ${TOTAL}%"

          TOTAL_INT=${TOTAL%%.*}
          if [ "$TOTAL_INT" -lt "${COVERAGE_MIN}" ]; then
            echo "Coverage gate failed: ${TOTAL}% is below the required ${COVERAGE_MIN}%"
            exit 1
          fi

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-agent-coverage
          path: coverage.xml

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-test-log
          path: odoo-test.log

  # ==========================================================================
  # Security: Bandit SAST + Trivy container scan
  # ==========================================================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Bandit: Python SAST on Odoo addon + invoice-ai ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (Odoo addon)
        run: |
          bandit -r custom_addons/invoice_agent/ \
            --severity-level medium \
            -f json -o bandit-addon.json || true
          bandit -r custom_addons/invoice_agent/ \
            --severity-level medium \
            -f screen

      - name: Run Bandit (invoice-ai)
        run: |
          bandit -r invoice-ai/app/ \
            --severity-level medium \
            -f json -o bandit-ai.json || true
          bandit -r invoice-ai/app/ \
            --severity-level medium \
            -f screen

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: bandit-*.json

      # --- Trivy: container image scan (invoice-ai) ---
      - name: Build invoice-ai image for scanning
        run: docker build -t invoice-ai:security-scan ./invoice-ai

      - name: Trivy scan (invoice-ai image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: invoice-ai:security-scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # --- Trivy: filesystem scan (Odoo addon + Dockerfile) ---
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: addons,doc,setup,.git

      # --- DR runbook freshness check ---
      - name: Verify DR runbook exists and is current
        run: |
          if [ ! -f docs/runbooks/disaster-recovery.md ]; then
            echo "ERROR: docs/runbooks/disaster-recovery.md is missing!"
            exit 1
          fi
          MODIFIED=$(stat -c %Y docs/runbooks/disaster-recovery.md)
          NOW=$(date +%s)
          DAYS_OLD=$(( (NOW - MODIFIED) / 86400 ))
          echo "DR runbook is $DAYS_OLD days old"
          if [ $DAYS_OLD -gt 90 ]; then
            echo "WARNING: DR runbook is older than 90 days — please re-run the quarterly restore drill and update it."
            exit 1
          fi
