# automatically generated file by the runbot nightly ruff checks, do not modify
# for ruff version 0.15.0 (or higher)
# note: 'E241', 'E272', 'E201', 'E221' are ignored on runbot in test files when formating a table like structure (more than two space)
# some rules present here are not enabled on runbot (yet) but are still advised to follow when possible : ["B904", "COM812", "E741", "EM101", "I001", "RET", "RUF021", "RUF102", "TRY002", "UP006", "UP007"]


target-version = "py310"

[lint]
preview = true
external = ["OLS"]
select = [
    "BLE",        # flake8-blind-except
    "C",          # flake8-comprehensions
    "COM",        # flake8-commas
    "E",          # pycodestyle Error
    "EM",         # flake8-errmsg
    "EXE",        # flake8-executable
    "F",          # Pyflakes
    "FA",         # flake8-future-annotations
    "FLY",        # flynt
    "G",          # flake8-logging-format
    "I",          # isort
    "ICN",        # flake8-import-conventions
    "INT",        # flake8-gettext
    "ISC",        # flake8-implicit-str-concat
    "LOG",        # flake8-logging
    "PGH",        # pygrep-hooks
    "PIE",        # flake8-pie
    "PLC",        # Pylint Convention
    "PLE",        # Pylint Error
    "PLW",        # Pylint Warning
    "PYI",        # flake8-pyi
    "RET",        # flake8-return
    "RUF",        # Ruff-specific rules
    "SIM",        # flake8-simplify
    "SLOT",       # flake8-slots
    "T",          # flake8-print
    "TC",         # flake8-type-checking
    "TID",        # flake8-tidy-imports
    "TRY",        # tryceratops
    "UP",         # pyupgrade
    "W",          # pycodestyle Warning
    "YTT",        # flake8-2020
]
ignore = [
    "unnecessary-collection-call",       # unnecessary-collection-call
    "unnecessary-dict-comprehension-for-iterable",       # unnecessary-dict-comprehension-for-iterable
    "complex-structure",       # complex-structure
    "multiple-leading-hashes-for-block-comment",       # multiple-leading-hashes-for-block-comment
    "line-too-long",       # line-too-long
    "not-in-test",       # not-in-test
    "f-string-in-exception",      # f-string-in-exception
    "future-rewritable-type-annotation",      # future-rewritable-type-annotation
    "blanket-type-ignore",     # blanket-type-ignore
    "unnecessary-placeholder",     # unnecessary-placeholder
    "unnecessary-range-start",     # unnecessary-range-start
    "import-private-name",    # import-private-name
    "redefined-loop-name",    # redefined-loop-name
    "ambiguous-unicode-character-string",     # ambiguous-unicode-character-string
    "collection-literal-concatenation",     # collection-literal-concatenation
    "mutable-class-default",     # mutable-class-default
    "non-empty-init-module",     # non-empty-init-module
    "unused-noqa",     # unused-noqa
    "collapsible-if",     # collapsible-if
    "if-else-block-instead-of-if-exp",     # if-else-block-instead-of-if-exp
    "multiple-with-statements",     # multiple-with-statements
    "relative-imports",     # relative-imports
    "raise-vanilla-args",     # raise-vanilla-args
    "try-consider-else",     # try-consider-else
    "error-instead-of-exception",     # error-instead-of-exception
    "printf-string-formatting",      # printf-string-formatting
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "unused-import",       # unused-import
]

[lint.isort]
# https://www.odoo.com/documentation/latest/contributing/development/coding_guidelines.html#imports
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["odoo"]
known-local-folder = ["odoo.addons"]
