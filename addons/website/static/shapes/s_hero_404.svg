			}
			to {
				translate: var(--slide-to);
			}
		}

		#blurred_cloud_left, #blurred_cloud_right, #front_stars, #bg_stars_blurred {
			animation: slide 10s linear infinite;
		}

		#blurred_cloud_left {
			--slide-from: -130.24px -7.42px;
			--slide-to: 347.21px -7.42px;
		}

