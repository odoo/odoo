<section data-screen="result" class="jm_screen jm_hide">
    <div class="jm_body">
        <div data-role="match">
            <p class="jm_result_intro" data-role="intro"></p>
            <h1 class="jm_title" data-role="best_name"></h1>
            <p class="jm_match" data-role="best_percent"></p>
            <div class="jm_meter">
                <div class="jm_meter_bar" data-role="best_bar"></div>
            </div>
            <div class="jm_result_description" data-role="best_description"></div>
            <a class="jm_cta jm_hide" data-role="cta" target="_blank" rel="noopener"></a>
            <div class="jm_runners jm_hide" data-role="runners">
                <p class="jm_result_intro" data-role="runners_label"></p>
                <div data-role="runners_list"></div>
            </div>
        </div>
        <p class="jm_status" data-role="status"></p>
        <p class="jm_error" data-role="error"></p>
    </div>
    <div class="jm_actions jm_hide" data-role="actions">
        <button type="button" data-role="retry">Try again</button>
    </div>
</section>
