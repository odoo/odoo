# =============================================================================
# nginx/conf.d/odoo.conf — Nginx reverse proxy for Odoo 19
#
# Serves https://invoices.<domain>
# Proxies Odoo (8069) and websocket (8072) upstreams.
# =============================================================================

upstream odoo_upstream {
    server odoo:8069;
}

upstream odoo_ws_upstream {
    server odoo:8072;
}

# =============================================================================
# HTTP → HTTPS redirect (required for Let's Encrypt ACME HTTP-01 challenge)
# =============================================================================
server {
    listen 80;
    server_name invoices.<domain>;

    # ACME HTTP-01 challenge — Let's Encrypt certbot writes here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS server
# =============================================================================
server {
    listen 443 ssl http2;
    server_name invoices.<domain>;

    # ========================
    # TLS Certificates (Let's Encrypt — mounted from certbot container / host)
    # ========================
    ssl_certificate     /etc/letsencrypt/live/invoices.<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invoices.<domain>/privkey.pem;

    # ========================
    # Modern TLS best practices
    # ========================
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS (strict transport security) — 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========================
    # Common proxy headers
    # ========================
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_redirect off;

    # ========================
    # Standard Odoo requests (HTTP)
    # ========================
    location / {
        proxy_pass http://odoo_upstream;

        # Increase body size for scanned invoice PDFs (up to 100 MB)
        client_max_body_size 100m;

        # Odoo long-poll: business flows can take 10+ minutes
        proxy_read_timeout 720s;
        proxy_connect_timeout 90s;

        # Buffering: let Odoo stream responses, don't buffer large bodies
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ========================
    # Websocket connections (Odoo live chat, bus, queue kanban)
    # CRITICAL: These headers are REQUIRED for the HTTP Upgrade handshake.
    # Without "Upgrade" and "Connection" headers, the browser's WebSocket
    # connection will fail with 400 Bad Request or hang indefinitely.
    # ========================
    location /websocket {
        proxy_pass http://odoo_ws_upstream;

        # WebSocket protocol upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeout: websockets can idle for hours
        proxy_read_timeout 86400s;

        # No body buffering for websocket connections
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ========================
    # Static assets — serve directly from Odoo (or CDN if needed)
    # ========================
    location /web/static/ {
        proxy_pass http://odoo_upstream;
        proxy_cache_valid 200 60m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
